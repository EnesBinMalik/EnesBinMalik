<text x="218" y="104" class="h" font-size="23" fill="url(#gold)" filter="url(#g)">Öztürk</text>
<text x="218" y="104" class="h" font-size="23" fill="#F8FBFF" fill-opacity="0.88">Öztürk</text>
<line x1="218" y1="118" x2="330" y2="118" stroke="url(#ac)" stroke-width="1.6"/>
