<line x1="112" y1="20" x2="112" y2="196" stroke="#22D3EE" stroke-opacity="0.10"/>
<g transform="translate(112 108)">
<path d="M0 0 L82 0 A82 82 0 0 1 58 58 Z" fill="#22D3EE" fill-opacity="0.20"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/></path>
<line x1="0" y1="0" x2="82" y2="0" stroke="#22D3EE" stroke-width="1.8" filter="url(#g)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/></line>
</g>
<circle cx="152" cy="78" r="2.6" fill="#FBBF24" filter="url(#g)"/>
<circle cx="68" cy="146" r="2.6" fill="#FBBF24" filter="url(#g)"/>
