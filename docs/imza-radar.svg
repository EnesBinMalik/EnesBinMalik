<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200" role="img" aria-label="Enes Öztürk — radar animasyonu">
<style>.h{font-family:'Segoe UI',system-ui,sans-serif;font-weight:700}.t{font-family:'Segoe UI',system-ui,sans-serif}.m{font-family:'Consolas','Cascadia Code',monospace}.cap{font-family:'Segoe UI',sans-serif;font-weight:700;letter-spacing:3px}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070C"/><stop offset="1" stop-color="#0A111C"/></linearGradient><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#34D399"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0C2"/><stop offset="0.45" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/></linearGradient><filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.2" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="450" height="200" rx="14" fill="url(#bg)"/>
<rect x="0" y="0" width="450" height="3" fill="url(#ac)"/>
<circle cx="112" cy="108" r="34" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>
